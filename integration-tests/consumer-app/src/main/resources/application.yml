spring:
  application:
    name: gothdb-consumer-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gothdb}
    username: ${DATABASE_USERNAME:gothdb}
    password: ${DATABASE_PASSWORD:gothdb}
  sql:
    init:
      mode: always

gothdb:
  enabled: true
  path: /gothdb # you can change it to your custom path
  security:
    mode: basic # auto | basic | spring-security | none
    username: ${GOTHDB_USERNAME:gothdb}
    password: ${GOTHDB_PASSWORD:gothdb} # sample credentials, override them outside this demo

server:
  port: ${SERVER_PORT:8080}
